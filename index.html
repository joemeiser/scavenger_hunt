<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden Gems</title>
<meta name="theme-color" content="#003865">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ec;--ink:#1c2430;--mut:#5c6675;--card:#fff;--line:#d9d3c5;--pri:#003865;--acc:#e87722;--good:#1d7a46;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--ink:#eef1f5;--mut:#a3adba;--card:#1c232d;--line:#313b48;--pri:#6fb1e6;--acc:#f09a55;--good:#62c98d;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-family:Georgia,serif;font-size:2rem;margin:0 0 4px;color:var(--pri)}
h2{font-family:Georgia,serif;font-size:1.35rem;margin:4px 0 8px}
.sub,.step{color:var(--acc);font-weight:600;margin:0 0 12px;letter-spacing:.02em}
.clue{font-family:Georgia,serif;font-size:1.25rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:16px}
.small{font-size:.85rem;color:var(--mut)}
.good{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--acc);font-size:.9rem}
button,.filebtn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block}
button:disabled{opacity:.5}
.big{display:block;width:100%;background:var(--pri);color:var(--bg);border:0;font-weight:700;padding:16px;margin:14px 0;text-align:center;font-size:1.05rem}
.filebtn input,.filelink input{position:absolute;width:1px;height:1px;opacity:0}
.filelink{display:block;text-align:center;text-decoration:underline;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.status{min-height:1.5em;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
input:not([type=checkbox]):not([type=range]):not([type=file]),textarea{font:inherit;width:100%;padding:10px;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:block;margin:12px 0}input[type=range]{width:100%}
.check{display:flex;gap:10px;align-items:flex-start}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
figure{margin:0}figure img,.nophoto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.nophoto{display:grid;place-items:center;color:var(--mut);font-size:.85rem}figcaption{font-size:.85rem;margin-top:4px}
.gemlist{padding-left:20px}.gemlist li{margin:8px 0}.mini{display:block}.mini button{padding:4px 10px;font-size:.85rem;margin:4px 4px 0 0}
details{margin:10px 0}a{color:var(--pri)}ul{padding-left:20px}
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
